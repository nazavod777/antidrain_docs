name: Deploy Docs Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Builds on every push AND every pull request, so a broken contrast ratio,
  # a lost anchor, a missing URL or a dead link fails review rather than
  # reaching production. The old workflow published a pre-built gh-pages
  # branch and never built anything, so CSS edits on main did not deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-based "last updated" timestamps

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD stops the playwright postinstall from
      # fetching Chromium, Firefox AND WebKit — roughly a gigabyte, of which we
      # need one browser.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # check:layout drives a real browser over dist/, so it needs a Chromium.
      # npx resolves the playwright already in node_modules, so the browser
      # revision always matches the library. --with-deps pulls the system
      # libraries a headless Chromium needs on a clean runner.
      - run: npx playwright install --with-deps chromium

      # `build` runs `lint` first, then the VitePress build with its dead-link
      # check, then the legacy redirect stubs, check:urls and check:layout. Any
      # of them failing stops the deploy. What `lint` itself contains is written
      # down in package.json and nowhere else, so it cannot go stale here.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 7

  deploy:
    # Only main deploys; pull requests stop at a verified build.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
